<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intent to Desktop VLC Parser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for webkit to keep the dark theme consistent */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        
        /* Toast animation */
        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .toast-animate {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 font-sans antialiased relative overflow-x-hidden">

    <!-- Toast Notification Container -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-800 border border-gray-700 text-white px-6 py-3 rounded-full shadow-2xl z-50 hidden opacity-0 transition-opacity duration-300 flex items-center gap-2">
        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMsg" class="font-medium text-sm">Copied to clipboard!</span>
    </div>

    <!-- Main Container -->
    <div class="bg-gray-900 p-6 sm:p-10 rounded-3xl shadow-2xl w-full max-w-4xl border border-gray-800 relative overflow-hidden">
        
        <!-- Decorative background glow -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-32 bg-orange-500/10 blur-[100px] pointer-events-none"></div>

        <!-- Header -->
        <div class="flex flex-col sm:flex-row items-center sm:items-start space-y-4 sm:space-y-0 sm:space-x-5 mb-8 border-b border-gray-800 pb-6 relative z-10">
            <div class="bg-gray-800 p-3 rounded-2xl border border-gray-700 shadow-inner">
                <svg class="w-10 h-10 text-orange-500" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L2 22h20L12 2zm0 3.8l6.4 12.8H5.6L12 5.8zM11 9v5h2V9h-2zm0 6v2h2v-2h-2z"/>
                </svg>
            </div>
            <div class="text-center sm:text-left">
                <h1 class="text-3xl font-bold text-white tracking-tight mb-1">Desktop VLC Parser</h1>
                <p class="text-gray-400 text-sm max-w-lg">Bypass unconfigured protocol handlers on Mac/Windows by generating highly reliable <span class="text-orange-400 font-mono text-xs">.m3u</span> playlist files directly from Intent URLs.</p>
            </div>
        </div>

        <!-- Input Section -->
        <div class="mb-8 relative z-10">
            <label for="intentInput" class="block text-sm font-semibold text-gray-300 mb-2 flex items-center justify-between">
                <span>Paste Intent URL:</span>
                <span class="text-xs font-normal text-gray-500">Starts with intent://</span>
            </label>
            <textarea 
                id="intentInput" 
                class="w-full h-28 p-4 bg-gray-950 text-gray-300 border border-gray-700 rounded-2xl focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500 transition shadow-inner resize-y font-mono text-sm break-all leading-relaxed placeholder-gray-600"
                placeholder="intent://play?url=https%3A%2F%2Fexample.com%2Fvideo.mp4&title=My%20Video#Intent;..."
            ></textarea>
            
            <button 
                onclick="parseIntent()" 
                class="mt-5 w-full bg-gradient-to-r from-orange-600 to-orange-500 hover:from-orange-500 hover:to-orange-400 text-white font-bold py-4 px-6 rounded-2xl transition duration-300 ease-in-out shadow-lg hover:shadow-orange-500/25 flex items-center justify-center gap-2 group">
                <svg class="w-5 h-5 transform group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Extract Stream Data
            </button>
        </div>

        <!-- Error Message Container -->
        <div id="errorMsg" class="hidden mb-8 p-4 bg-red-950/50 border border-red-900/50 text-red-400 rounded-2xl text-sm font-medium flex items-start gap-3">
            <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span id="errorText"></span>
        </div>

        <!-- Results Section (Hidden by default) -->
        <div id="results" class="hidden space-y-6 relative z-10 animate-fade-in">
            
            <div class="bg-gray-950 border border-gray-800 rounded-2xl p-6 shadow-inner">
                <div class="mb-5">
                    <h3 class="text-[10px] uppercase font-bold text-gray-500 tracking-widest mb-2 flex items-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
                        Extracted Title
                    </h3>
                    <p id="resTitle" class="text-white font-medium text-lg lg:text-xl leading-tight"></p>
                </div>
                <div>
                    <h3 class="text-[10px] uppercase font-bold text-gray-500 tracking-widest mb-2 flex items-center gap-2">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                        Raw Stream URL
                    </h3>
                    <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 relative group">
                        <p id="resUrl" class="text-blue-400 font-mono text-xs sm:text-sm break-all pr-12"></p>
                        <!-- Quick Copy URL Button inside the box -->
                        <button onclick="copyRawUrl()" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white rounded-lg transition-colors" title="Copy raw URL only">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <!-- Option 1: M3U File (Most Reliable) -->
                <button onclick="generateAndDownloadM3U()" class="flex flex-col items-center text-center bg-green-900/20 border border-green-700/50 hover:bg-green-800/40 text-green-300 py-5 px-4 rounded-2xl transition duration-300 relative overflow-hidden group">
                    <div class="absolute top-0 right-0 bg-green-600 text-white text-[9px] font-bold px-2 py-0.5 rounded-bl-lg tracking-wider uppercase">Most Reliable</div>
                    <svg class="w-8 h-8 mb-3 text-green-500 group-hover:-translate-y-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span class="font-bold text-sm text-green-100">Download .m3u File</span>
                    <span class="text-xs mt-1 opacity-75">Double-click to open in VLC securely on Mac/Win.</span>
                </button>

                <!-- Option 2: Copy for manual input -->
                <button onclick="copyRawUrlForNetwork()" class="flex flex-col items-center text-center bg-blue-900/20 border border-blue-700/50 hover:bg-blue-800/40 text-blue-300 py-5 px-4 rounded-2xl transition duration-300 group">
                    <svg class="w-8 h-8 mb-3 text-blue-500 group-hover:-translate-y-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    <span class="font-bold text-sm text-blue-100">Copy for Network Stream</span>
                    <span class="text-xs mt-1 opacity-75">VLC > File > Open Network... paste URL there.</span>
                </button>

                <!-- Option 3: vlc:// Protocol (Hit or miss on Desktop) -->
                <a id="btnVlcProtocol" href="#" class="flex flex-col items-center text-center bg-orange-900/20 border border-orange-700/50 hover:bg-orange-800/40 text-orange-300 py-5 px-4 rounded-2xl transition duration-300 group">
                    <svg class="w-8 h-8 mb-3 text-orange-500 group-hover:-translate-y-1 transition-transform" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8l6.4 12.8H5.6L12 5.8zM11 9v5h2V9h-2zm0 6v2h2v-2h-2z"/></svg>
                    <span class="font-bold text-sm text-orange-100">Open via vlc:// Link</span>
                    <span class="text-xs mt-1 opacity-75">Requires OS registry/setup to work natively.</span>
                </a>

            </div>
        </div>
    </div>

    <script>
        // Global variables to hold parsed state
        let currentUrl = '';
        let currentTitle = '';

        function parseIntent() {
            const input = document.getElementById('intentInput').value.trim();
            const resultsDiv = document.getElementById('results');
            const errorDiv = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            
            // Reset state
            errorDiv.classList.add('hidden');
            resultsDiv.classList.add('hidden');

            if (!input) {
                showError("Please paste an intent URL.");
                return;
            }

            try {
                // Find where the query string starts
                const queryStart = input.indexOf('?');
                const hashStart = input.indexOf('#Intent');

                if (queryStart === -1) {
                    throw new Error("Invalid format: Could not find query parameters (no '?' found).");
                }

                // Extract query string part
                const endIdx = hashStart !== -1 ? hashStart : input.length;
                const queryString = input.substring(queryStart, endIdx);

                // Parse query parameters securely
                const params = new URLSearchParams(queryString);
                currentUrl = params.get('url');
                currentTitle = params.get('title') || 'Extracted_Stream';

                if (!currentUrl) {
                    throw new Error("Invalid format: No 'url' parameter found in the intent string.");
                }

                // 1. Update UI Text
                document.getElementById('resTitle').textContent = currentTitle;
                document.getElementById('resUrl').textContent = currentUrl;

                // 2. Setup vlc:// protocol link (Option 3)
                document.getElementById('btnVlcProtocol').href = `vlc://${currentUrl}`;

                // Show results smoothly
                resultsDiv.classList.remove('hidden');

            } catch (err) {
                showError(err.message);
            }
        }

        function generateAndDownloadM3U() {
            if (!currentUrl) return;

            // M3U format standard structure
            const m3uContent = `#EXTM3U\n#EXTINF:-1,${currentTitle}\n${currentUrl}\n`;
            
            // Create a Blob containing the text data
            const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl' });
            const blobUrl = URL.createObjectURL(blob);
            
            // Create temporary hidden link to trigger download
            const tempLink = document.createElement('a');
            tempLink.href = blobUrl;
            
            // Clean up title for a safe filename
            const safeFilename = currentTitle.replace(/[^a-zA-Z0-9-]/g, '_').substring(0, 50);
            tempLink.download = `${safeFilename}.m3u`;
            
            // Append, click, and cleanup
            document.body.appendChild(tempLink);
            tempLink.click();
            document.body.removeChild(tempLink);
            
            // Release memory
            setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
            
            showToast("Playlist downloaded!");
        }

        function copyRawUrlForNetwork() {
            copyToClipboard(currentUrl, "URL copied for Open Network Stream!");
        }

        function copyRawUrl() {
            copyToClipboard(currentUrl, "Raw URL copied!");
        }

        // Reliable copy function using execCommand for iframe compatibility
        function copyToClipboard(text, successMessage) {
            if (!text) return;

            const textArea = document.createElement("textarea");
            textArea.value = text;
            // Move it off-screen to avoid scrolling or visual jumping
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast(successMessage);
                } else {
                    showToast("Failed to copy text.");
                }
            } catch (err) {
                showToast("Your browser doesn't support automatic copying.");
            }
            
            document.body.removeChild(textArea);
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            
            toastMsg.textContent = message;
            
            // Reset animation
            toast.classList.remove('hidden', 'toast-animate');
            void toast.offsetWidth; // trigger reflow
            
            toast.classList.add('toast-animate');
            toast.style.opacity = '1';
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.classList.add('hidden'), 300); // wait for fade out
            }, 3000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
